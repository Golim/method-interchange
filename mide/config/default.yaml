crawling:
  max_pages: 10          # Default quick mode (user decision)
  max_depth: 5           # BFS depth limit
  page_load_timeout: 30000  # 30 seconds (Playwright default, user decision)
  sleep_between_pages: 5    # No rate limiting in Phase 2 (deferred to Phase 5)
  only_internal: true       # Only crawl internal links (subdomains considered internal)
  max_clickable: 10     # Max standalone buttons/[role=button] to click per page (0 = disable)
  max_forms: 5          # Max forms to interact with per page (0 = disable)
  max_form_fields: 20   # Max inputs/selects to touch per form
  form_action_timeout: 1000       # Timeout for individual form actions in milliseconds
  form_interaction_timeout: 15000 # Overall form/button interaction budget per page in milliseconds
  dangerous_action_patterns:   # Action keywords skipped at button-click (BFS) AND at POST capture (URL-path substring); case-insensitive
    - "logout"
    - "log out"
    - "sign out"
    - "delete"
    - "remove"
    - "cancel"
    - "unsubscribe"
    - "deactivate"
    - "transfer"
    - "payment"
    - "admin"
    - "destroy"
    - "password-reset"

browser:
  headless: true
  args:
    - "--no-sandbox"
    - "--disable-setuid-sandbox"
    - "--disable-dev-shm-usage"

browser_use_chrome:
  headless: false
  persist_user_data_dir: "~/.cache/method-interchangeability/browser-use-user-data-dir-persistent"

capture:
  deduplicate: true       # Deduplicate POST captures by URL path only (ignores body)
  max_posts: 100          # Max POST requests to capture per site (0 = unlimited)
  blacklisted_domains:    # Analytics/tracking domains to exclude from capture
    - doubleclick.net
    - googleadservices.com
    - google-analytics.com
    - googletagmanager.com
    - googletagservices.com
    - googleapis.com
    - googlesyndication.com
    - analytics.tiktok.com
    - gstatic.com
  blacklisted_url_patterns:  # URL path patterns to exclude (regex)
    - '(sign|log|opt)[+-_]*(out|off)|leave'  # Logout URLs
    - '\.well-known/shopify/monorail'        # Shopify analytics
    - '/analytics'                            # Generic analytics
    - '/tracking'                             # Generic tracking
    - '/beacon'                               # Beacon endpoints
    - '/metrics'                              # Metrics
    - '/cdn-cgi/challenge-platform'           # Cloudflare related
    - '/cdn-cgi/rum'                          # Cloudflare related
    - '/stats'                                # Generic stats
    - '/googleanalytics'
    - '/collect'                               # Google Analytics collect endpoint
  dedup_bypass_patterns:  # URL patterns that skip dedup (substring match, case-insensitive)
    - '/graphql'
    - '/graphiql'

output:
  directory: "output"     # Output directory for captured requests

logging:
  level: "INFO"           # Default normal verbosity
  error_log_dir: "logs"   # Error log directory

detection:
  similarity_threshold: 95.0   # % threshold for interchangeability verdict
  array_style: "php"           # Array serialization: php, numbered, repeated
  max_json_depth: 2            # Max nesting depth for JSON body conversion
  request_timeout: 30          # GET request timeout in seconds
  rate_limit_delay: 2.0        # Delay between requests in seconds
  enable_normalization: false  # Opt-in: normalize dynamic content before comparison

batch:
  inter_site_delay: 5       # Seconds to wait between finishing one site and starting the next (politeness)
  site_timeout: 900
  mode: "full"              # Default batch mode: crawl, detect, full
  browser_restart: true     # Restart browser between sites (clean state per site)
